# Generate artifacts only. Website commits are made through the owner's authorized account.
name: Build static video previews
on:
  workflow_dispatch:
  push:
    branches: [site-serif-preview-20261001]
    paths:
      - '.github/workflows/site-posters.yml'
      - 'scripts/build_posters.py'
permissions:
  contents: read
concurrency:
  group: site-posters-${{ github.ref }}
  cancel-in-progress: false
jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Extract the final decoded frame of each sample video
        run: python3 scripts/build_posters.py
      - name: Save preview artifacts for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-frame-posters
          path: media/posters/
          retention-days: 14
