name: Build static video previews
on:
  workflow_dispatch:
  push:
    branches: [site-serif-preview-20261001]
    paths:
      - '.github/workflows/site-posters.yml'
      - 'scripts/build_posters.py'
permissions:
  contents: read
concurrency:
  group: site-posters-${{ github.ref }}
  cancel-in-progress: false
jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Extract the first decoded frame of each sample video
        run: python3 scripts/build_posters.py
      - name: Save generated poster images
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/posters
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate first-frame previews for all 30 RNA sample videos'
          git push origin "HEAD:${TARGET_BRANCH}"
