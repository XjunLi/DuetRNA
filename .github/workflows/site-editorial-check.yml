name: Validate serif layout and inline films
on:
  workflow_dispatch:
  push:
    branches: [site-serif-preview-20261001]
    paths:
      - '.github/workflows/site-editorial-check.yml'
      - 'scripts/apply_editorial_revision.py'
      - 'scripts/check_site.py'
      - 'assets/refinements.css'
      - 'assets/inline-players.js'
permissions:
  contents: read
concurrency:
  group: site-editorial-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
      - name: Install validation tools
        run: |
          python3 -m pip install beautifulsoup4==4.13.4 playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Apply the layout migration
        run: python3 scripts/apply_editorial_revision.py
      - name: Check JavaScript
        run: |
          node --check assets/site.js
          node --check assets/inline-players.js
          node --check viewer/viewer.js
      - name: Validate real video playback and responsive layouts
        run: python3 scripts/check_site.py
      - name: Save the validated static pages
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html demo/index.html viewer/index.html assets/site.css SITE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use serif typography, visible first-frame previews and inline playback; remove unofficial wave mark'
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Preserve screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-editorial-check
          path: qa/editorial/
          retention-days: 14
