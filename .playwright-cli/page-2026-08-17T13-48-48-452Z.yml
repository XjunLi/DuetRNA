    - generic [ref=e16]:
      - heading "Overview" [level=2] [ref=e17]
      - paragraph [ref=e18]: DuetRNA is a generative model for de novo RNA backbone design. Each nucleotide carries two coupled rigid frames — a base-anchored frame for inter-residue geometry and a sugar-anchored frame for backbone reconstruction — supervised with a relative-pose loss that keeps the pair chemically coherent. Trained on RNAsolo, DuetRNA improves designability over RNA-FrameFlow on matched protocols, and yields more distinct designable structural modes per generation attempt.
